# LLaMA-3.2-3B-Instruct Stage 1 (salience) config
#
# parse_failure_fallback: 0 (non-salient).
# Salient is actually the MAJORITY class in train (621/723 = 85.9%),
# so this fallback intentionally chooses the MINORITY class. The
# rationale is downstream-cost asymmetry: a parse failure on Stage 1
# should not push a sentence into the expensive Stage 2 path
# spuriously. We accept a small recall loss on Stage 1 to avoid
# poisoning the Stage 2 evaluation set with sentences whose salience
# is unknown.
#
# Decoding is hard-coded to greedy (do_sample=False, temperature irrelevant)
# in llama_inference.py for reproducibility.

model_name: meta-llama/Llama-3.2-3B-Instruct

# --- prompt schema ---
prompt_template_version: "v1.0"

# Few-shot example task_ids drawn from train, hard-coded for reproducibility.
# task_id 13264 sentence_idx 5  → non-salient (filler)
# task_id 13264 sentence_idx 0  → salient (claim with temporal/social cues)
# task_id 13282 sentence_idx 29 → salient (concrete personal observation)
# task_id 13267 sentence_idx 9  → non-salient (transitional remark)
# task_id 13270 sentence_idx 1  → salient (claim with abstract group cues)
few_shot_task_ids:
  - {task_id: 13264, sentence_idx: 5,  label: 0}   # "But it isn't just limited to science fiction." — filler transition
  - {task_id: 13264, sentence_idx: 0,  label: 1}   # "Over the past couple of thousand years..." — claim
  - {task_id: 13282, sentence_idx: 29, label: 1}   # "Edit: I just re-read your post..." — concrete reasoning
  - {task_id: 13267, sentence_idx: 9,  label: 0}   # non-salient transition
  - {task_id: 13270, sentence_idx: 1,  label: 1}   # "When we exist 24/7 with these machines..." — claim

# System prompt injected as the system role in the chat template.
system_prompt: |
  You are a research assistant specializing in argument analysis. Your task is to
  classify whether a sentence from an online argument is "salient" — that is,
  whether it contains the main claim, supporting evidence, or connecting reasoning
  of the argument.

  Non-salient sentences are filler, transitional phrases, meta-commentary, or
  conversational acknowledgements that carry no argumentative content.

  Reply with exactly one token: 1 if the sentence is salient, 0 if it is not.
  Do not add any explanation, punctuation, or other text.

# User-turn template. {few_shot_block} and {sentence} are filled at runtime.
user_prompt_template: |
  {few_shot_block}Sentence: "{sentence}"
  Salient (1) or non-salient (0)?

# Template for each few-shot example inside the user turn.
few_shot_example_template: |
  Sentence: "{sentence}"
  Salient (1) or non-salient (0)? {label}

# --- generation ---
# Decoding is greedy (do_sample=False) — hard-coded in llama_inference.py.
max_new_tokens: 8

# --- parse_failure_fallback ---
# 0 = non-salient (minority class). See header comment for rationale.
parse_failure_fallback: 0

# --- I/O paths (relative to repo root) ---
data_dir: data/processed
output_dir: outputs
raw_log_path: outputs/llama_stage1_{split}_raw.jsonl
predictions_path: outputs/llama_stage1_{split}_predictions.json
